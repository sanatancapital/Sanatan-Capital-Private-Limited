<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Partner Login | Sanatan Capital</title>
    <style>
        /* --- Base & Reset --- */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* --- Login Card --- */
        .login-card { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 380px; 
            box-sizing: border-box;
        }

        /* --- Branding --- */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo { 
            font-size: 26px; 
            font-weight: 800; 
            color: #1e3a8a; /* Deep Navy Blue */
            letter-spacing: 0.5px;
        }
        .logo span { 
            color: #d97706; /* Golden/Saffron Accent */
        }
        .subtitle { 
            color: #64748b; 
            margin-top: 5px; 
            font-size: 14px; 
            font-weight: 500;
        }

        /* --- Form Elements --- */
        .input-group { 
            text-align: left; 
            margin-bottom: 20px; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #334155; 
            font-size: 14px; 
            font-weight: 600; 
        }
        .input-group input { 
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
            transition: all 0.3s ease; 
        }
        .input-group input:focus { 
            border-color: #1e3a8a; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); 
        }

        /* --- Buttons --- */
        .btn-primary { 
            background-color: #1e3a8a; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.3s; 
        }
        .btn-primary:hover { 
            background-color: #172554; 
        }
        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* --- Helpers --- */
        .help-text { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #64748b; 
            text-align: center;
        }
        .help-text a { 
            color: #d97706; 
            text-decoration: none; 
            font-weight: 700; 
        }
        .help-text a:hover {
            text-decoration: underline;
        }

        /* --- OTP Section Hidden by Default --- */
        #otp-section { 
            display: none; 
        }
        .message-box {
            font-size: 13px;
            color: #059669; /* Green for success */
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <div class="logo">Sanatan <span>Capital</span></div>
            <div class="subtitle">Secure DSA Partner Login</div>
        </div>
        
        <form id="authForm">
            
            <!-- Step 1: Email Input -->
            <div id="identity-section">
                <div class="input-group">
                    <label for="email">Registered Email Address</label>
                    <input type="email" id="email" placeholder="partner@example.com" required autocomplete="email">
                </div>
                <button type="button" class="btn-primary" id="btn-send-otp" onclick="handleSendOTP()">Send Secure OTP</button>
            </div>

            <!-- Step 2: OTP Input (Appears after Step 1) -->
            <div id="otp-section">
                <div class="message-box" id="otp-message"></div>
                <div class="input-group">
                    <label for="otp">Enter 6-Digit OTP</label>
                    <input type="number" id="otp" placeholder="0 0 0 0 0 0" maxlength="6">
                </div>
                <button type="button" class="btn-primary" onclick="handleLogin()">Verify & Login</button>
            </div>

        </form>

        <div class="help-text" id="footer-text">
            Not registered yet? <a href="#">Apply as DSA</a>
        </div>
    </div>

    <script>
        // यह फंक्शन बाद में Supabase के साथ कनेक्ट होगा
        function handleSendOTP() {
            const emailInput = document.getElementById('email').value;
            const btn = document.getElementById('btn-send-otp');
            
            if(emailInput.trim() === "") {
                alert("Please enter your registered email address.");
                return;
            }

            // लोडिंग एनीमेशन (ताकि यूज़र को लगे प्रोसेस हो रहा है)
            btn.innerText = "Verifying Details...";
            btn.disabled = true;

            // फिलहाल इसे 1.5 सेकंड का डेमो दिया है, असली में यहाँ Supabase का कोड आएगा
            setTimeout(() => {
                // फॉर्म बदलें
                document.getElementById('identity-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
                
                // मैसेज दिखाएं
                document.getElementById('otp-message').innerText = "✅ OTP has been sent securely to " + emailInput;
                document.getElementById('footer-text').style.display = 'none';
            }, 1500);
        }

        // OTP वेरीफाई करने का फंक्शन
        function handleLogin() {
            const otpInput = document.getElementById('otp').value;
            if(otpInput.length < 6) {
                alert("Please enter a valid 6-digit OTP");
                return;
            }
            // डैशबोर्ड पर ले जाने का कोड यहाँ आएगा
            alert("Login Successful! Redirecting to Partner Dashboard...");
        }
    </script>
</body>
</html>
